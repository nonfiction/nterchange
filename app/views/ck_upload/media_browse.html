<script type="text/javascript">
  var ckeditorfuncnum = '{/literal}{$ckeditorfuncnum}{literal}';
  function me_callback(){
    window.opener.CKEDITOR.tools.callFunction( ckeditorfuncnum, document.getElementById("mediaelement").value );
    window.close();
  };
  function pg_callback(){
    window.opener.CKEDITOR.tools.callFunction( ckeditorfuncnum, '/_page'+document.querySelector("select[name=pages]").value );
    window.close();
  };

</script>
